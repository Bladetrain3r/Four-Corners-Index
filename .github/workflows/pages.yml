name: pages
# Builds the static site (site/ plus the JSON generated from data/) and deploys it to GitHub Pages.
# Pages itself is switched on by the repository owner (Settings > Pages > Source: GitHub Actions); the builder never does that.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema pyyaml
      - name: Generate the site data and downloads
        run: python -m pipeline.publish --out site
      - name: Check the built site
        run: python -m pytest -q tests/test_site_static.py tests/test_publish.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
